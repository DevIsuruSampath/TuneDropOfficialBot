<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TuneDrop Welcome Image & Logo Generator</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 28px;
    padding: 48px 16px;
    background: #06060a;
    color: #e8e8ec;
    font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .page-header { text-align: center; display: flex; flex-direction: column; gap: 8px; }
  .page-header h1 {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 28px; font-weight: 700;
    background: linear-gradient(135deg, #e8793a, #f5a623, #e8793a);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    letter-spacing: -0.5px;
  }
  .page-header p { font-size: 14px; color: #6b6b80; letter-spacing: 0.2px; }
  .controls {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 14px; width: 100%; max-width: 820px;
    background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.06);
    border-radius: 16px; padding: 20px;
  }
  .controls label {
    display: flex; flex-direction: column; gap: 6px;
    font-size: 11px; font-weight: 600; color: #6b6b80;
    text-transform: uppercase; letter-spacing: 0.8px;
  }
  .controls input[type="text"] {
    background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08);
    border-radius: 10px; padding: 10px 14px; color: #e8e8ec;
    font-family: 'DM Sans', sans-serif; font-size: 14px;
    outline: none; transition: all 0.2s;
  }
  .controls input[type="text"]:focus {
    border-color: #e8793a; box-shadow: 0 0 0 3px rgba(232,121,58,0.12);
  }
  .color-row { display: flex; gap: 16px; align-items: flex-end; }
  .controls input[type="color"] {
    width: 48px; height: 40px; border: 1px solid rgba(255,255,255,0.08);
    border-radius: 10px; background: transparent; cursor: pointer; padding: 3px;
  }
  .section-divider {
    width: 100%; max-width: 820px;
    display: flex; align-items: center; gap: 16px;
    margin: 12px 0;
  }
  .section-divider span {
    font-family: 'Space Grotesk', sans-serif;
    font-size: 16px; font-weight: 600; color: #6b6b80;
    white-space: nowrap;
  }
  .section-divider::before, .section-divider::after {
    content: ''; flex: 1; height: 1px;
    background: rgba(255,255,255,0.06);
  }
  .canvas-wrap {
    position: relative; border-radius: 20px; overflow: hidden;
    border: 1px solid rgba(255,255,255,0.06);
    box-shadow: 0 4px 24px rgba(0,0,0,0.4), 0 20px 80px rgba(232,121,58,0.06);
    line-height: 0;
  }
  .canvas-wrap.logo-wrap {
    border-radius: 50%;
    box-shadow: 0 4px 24px rgba(0,0,0,0.4), 0 12px 48px rgba(232,121,58,0.1);
  }
  canvas.banner { display: block; width: 800px; height: 500px; }
  canvas.logo { display: block; width: 340px; height: 340px; }
  .logo-section {
    display: flex; flex-direction: column; align-items: center; gap: 16px;
  }
  .btn-row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; justify-content: center; }
  .btn {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 13px 32px; background: linear-gradient(135deg, #e8793a, #d46a2e);
    color: #fff; border: none; border-radius: 12px;
    font-family: 'DM Sans', sans-serif; font-size: 15px; font-weight: 600;
    cursor: pointer; transition: all 0.2s;
    box-shadow: 0 4px 16px rgba(232,121,58,0.25);
  }
  .btn:hover {
    background: linear-gradient(135deg, #f08a4e, #e8793a);
    transform: translateY(-1px); box-shadow: 0 6px 24px rgba(232,121,58,0.35);
  }
  .btn:active { transform: scale(0.97) translateY(0); }
  .btn-ghost {
    background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.1);
    color: #9d9db0; box-shadow: none; padding: 12px 24px;
  }
  .btn-ghost:hover {
    background: rgba(255,255,255,0.08); border-color: rgba(255,255,255,0.15);
    box-shadow: none; transform: translateY(-1px);
  }
</style>
</head>
<body>

<div class="page-header">
  <h1>TuneDrop Image Generator</h1>
  <p>Welcome banner & bot logo — customize and export</p>
</div>

<div class="controls">
  <label>Bot Name
    <input type="text" id="botName" value="Tune Drop Official">
  </label>
  <label>Tagline
    <input type="text" id="tagline" value="Your Music, Instantly. Any Song. Any Playlist.">
  </label>
  <label>Bot Username
    <input type="text" id="botUser" value="@TuneDropOfficialBot">
  </label>
  <label>Website
    <input type="text" id="website" value="tdrp.cc">
  </label>
  <div class="color-row">
    <label>Accent
      <input type="color" id="accentColor" value="#e8793a">
    </label>
    <label>Background
      <input type="color" id="bgColor" value="#08080a">
    </label>
  </div>
</div>

<!-- Welcome Banner -->
<div class="section-divider"><span>Welcome Banner</span></div>

<div class="canvas-wrap">
  <canvas class="banner" id="bannerCanvas" width="1600" height="1000"></canvas>
</div>

<div class="btn-row">
  <button class="btn" id="dlBannerJpg">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
    Banner JPG
  </button>
  <button class="btn btn-ghost" id="dlBannerPng">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
    Banner PNG
  </button>
</div>

<!-- Bot Logo -->
<div class="section-divider"><span>Bot Logo</span></div>

<div class="logo-section">
  <div class="canvas-wrap logo-wrap">
    <img id="logoImg" src="bot-logo.jpg" alt="Bot Logo" style="width:340px;height:340px;display:block;border-radius:50%;">
  </div>

  <div class="btn-row">
    <button class="btn" id="dlLogoOrig">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      Logo Original (1024)
    </button>
    <button class="btn btn-ghost" id="dlLogo512">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
      Logo 512px
    </button>
    <button class="btn btn-ghost" id="dlLogoJpg">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
      JPG
    </button>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);

// Banner canvas
const bc = $('bannerCanvas');
const bx = bc.getContext('2d');
const BW = 800, BH = 500, BDPR = 2;

// Logo image
const logoImg = $('logoImg');
let logoLoaded = false;
const logoSrc = new Image();
logoSrc.crossOrigin = 'anonymous';
logoSrc.onload = () => { logoLoaded = true; drawBanner(); };
logoSrc.src = 'bot-logo.jpg';

const fields = ['botName','tagline','botUser','website','accentColor','bgColor'].map($);

function hexToRgb(hex) {
  return { r: parseInt(hex.slice(1,3),16), g: parseInt(hex.slice(3,5),16), b: parseInt(hex.slice(5,7),16) };
}
function rgba(hex, a) {
  const {r,g,b} = hexToRgb(hex);
  return `rgba(${r},${g},${b},${a})`;
}

/* ====================== LOGO (uses real image) ====================== */

function drawLogo() {
  // Logo is displayed via <img> tag, no canvas drawing needed
}

/* ===================== BANNER DRAWING ===================== */

function drawVinyl(c, cx, cy, size, accent) {
  c.save();
  c.shadowColor = rgba(accent, 0.12);
  c.shadowBlur = 60;
  c.beginPath();
  c.arc(cx, cy, size, 0, Math.PI * 2);
  c.fillStyle = '#0f0f18';
  c.fill();
  c.shadowBlur = 0;

  c.beginPath();
  c.arc(cx, cy, size, 0, Math.PI * 2);
  c.strokeStyle = rgba('#ffffff', 0.06);
  c.lineWidth = 1.5;
  c.stroke();

  for (let i = 0; i < 20; i++) {
    const r = size * (0.28 + i * 0.033);
    if (r > size * 0.92) break;
    c.beginPath();
    c.arc(cx, cy, r, 0, Math.PI * 2);
    c.strokeStyle = rgba('#ffffff', 0.02 + (i % 3 === 0 ? 0.015 : 0));
    c.lineWidth = 0.5;
    c.stroke();
  }

  c.beginPath();
  c.arc(cx, cy, size * 0.7, -0.9, 0.3);
  c.strokeStyle = rgba('#ffffff', 0.05);
  c.lineWidth = size * 0.2;
  c.stroke();

  c.beginPath();
  c.arc(cx, cy, size * 0.55, 2.0, 2.8);
  c.strokeStyle = rgba('#ffffff', 0.03);
  c.lineWidth = size * 0.1;
  c.stroke();

  const labelGrad = c.createRadialGradient(cx - size*0.04, cy - size*0.04, 0, cx, cy, size * 0.25);
  labelGrad.addColorStop(0, rgba(accent, 0.6));
  labelGrad.addColorStop(0.7, rgba(accent, 0.3));
  labelGrad.addColorStop(1, rgba(accent, 0.15));
  c.beginPath();
  c.arc(cx, cy, size * 0.25, 0, Math.PI * 2);
  c.fillStyle = labelGrad;
  c.fill();

  c.beginPath();
  c.arc(cx, cy, size * 0.2, 0, Math.PI * 2);
  c.strokeStyle = rgba(accent, 0.2);
  c.lineWidth = 0.5;
  c.stroke();

  c.beginPath();
  c.arc(cx, cy, size * 0.25, 0, Math.PI * 2);
  c.strokeStyle = rgba(accent, 0.25);
  c.lineWidth = 1;
  c.stroke();

  c.beginPath();
  c.arc(cx, cy, size * 0.035, 0, Math.PI * 2);
  c.fillStyle = '#08080a';
  c.fill();
  c.strokeStyle = rgba('#ffffff', 0.08);
  c.lineWidth = 0.5;
  c.stroke();

  c.fillStyle = rgba('#ffffff', 0.8);
  c.font = `bold ${size * 0.18}px serif`;
  c.textAlign = 'center';
  c.textBaseline = 'middle';
  c.fillText('\u266B', cx, cy);

  c.fillStyle = rgba('#ffffff', 0.3);
  c.font = `600 ${size * 0.08}px "Space Grotesk", sans-serif`;
  c.fillText('TD', cx, cy + size * 0.13);

  c.restore();
}

function drawEqualizerBars(c, x, y, barW, barH, count, accent) {
  c.save();
  const heights = [0.35, 0.65, 1.0, 0.55, 0.8, 0.45, 0.9, 0.6, 0.4, 0.75, 0.5, 0.95, 0.55, 0.85, 0.48, 0.7, 0.38, 0.92, 0.58, 0.72];
  for (let i = 0; i < count; i++) {
    const h = heights[i % heights.length] * barH;
    const barY = y + barH - h;
    const alpha = 0.04 + heights[i % heights.length] * 0.08;
    const grad = c.createLinearGradient(0, barY, 0, y + barH);
    grad.addColorStop(0, rgba(accent, alpha * 2));
    grad.addColorStop(0.6, rgba(accent, alpha));
    grad.addColorStop(1, rgba(accent, alpha * 0.2));
    c.fillStyle = grad;
    c.beginPath();
    c.roundRect(x + i * (barW + 3), barY, barW, h, [barW/2, barW/2, 0, 0]);
    c.fill();
    c.beginPath();
    c.arc(x + i * (barW + 3) + barW/2, barY + barW/2, barW, 0, Math.PI * 2);
    c.fillStyle = rgba(accent, alpha * 0.3);
    c.fill();
  }
  c.restore();
}

function drawSoundWave(c, x, y, width, amplitude, freq, alpha, accent) {
  c.save();
  c.strokeStyle = rgba(accent, alpha);
  c.lineWidth = 1;
  c.beginPath();
  for (let i = 0; i <= width; i += 1) {
    const t = i / width;
    const amp = Math.sin(t * Math.PI * freq) * amplitude * Math.sin(t * Math.PI);
    if (i === 0) c.moveTo(x + i, y + amp);
    else c.lineTo(x + i, y + amp);
  }
  c.stroke();
  c.restore();
}

function drawFeaturePill(c, x, y, text, accent) {
  c.save();
  const pillH = 30;
  c.font = '13px "DM Sans", Inter, -apple-system, sans-serif';
  const tw = c.measureText(text).width;
  const pillW = tw + 40;
  const pillGrad = c.createLinearGradient(x, y, x + pillW, y + pillH);
  pillGrad.addColorStop(0, rgba(accent, 0.1));
  pillGrad.addColorStop(1, rgba(accent, 0.05));
  c.fillStyle = pillGrad;
  c.beginPath();
  c.roundRect(x, y, pillW, pillH, pillH / 2);
  c.fill();
  c.strokeStyle = rgba(accent, 0.2);
  c.lineWidth = 1;
  c.beginPath();
  c.roundRect(x, y, pillW, pillH, pillH / 2);
  c.stroke();
  c.beginPath();
  c.arc(x + 16, y + pillH / 2, 4, 0, Math.PI * 2);
  const dotGrad = c.createRadialGradient(x + 15, y + pillH/2 - 1, 0, x + 16, y + pillH / 2, 4);
  dotGrad.addColorStop(0, rgba(accent, 1));
  dotGrad.addColorStop(1, rgba(accent, 0.6));
  c.fillStyle = dotGrad;
  c.fill();
  c.fillStyle = rgba('#ffffff', 0.9);
  c.textAlign = 'left';
  c.textBaseline = 'middle';
  c.fillText(text, x + 28, y + pillH / 2 + 1);
  c.restore();
  return pillW;
}

function drawGlobeIcon(c, cx, cy, r, accent) {
  c.save();
  c.beginPath();
  c.arc(cx, cy, r, 0, Math.PI * 2);
  c.strokeStyle = accent;
  c.lineWidth = 1.5;
  c.stroke();
  c.beginPath();
  c.ellipse(cx, cy, r * 0.4, r, 0, 0, Math.PI * 2);
  c.strokeStyle = rgba(accent, 0.6);
  c.lineWidth = 1;
  c.stroke();
  c.beginPath();
  c.moveTo(cx - r, cy);
  c.lineTo(cx + r, cy);
  c.stroke();
  c.beginPath();
  c.ellipse(cx, cy, r, r * 0.35, 0, 0, Math.PI);
  c.stroke();
  c.beginPath();
  c.ellipse(cx, cy, r, r * 0.35, 0, Math.PI, Math.PI * 2);
  c.stroke();
  c.restore();
}

function drawCornerAccent(c, x, y, size, flip, accent) {
  c.save();
  c.strokeStyle = rgba(accent, 0.2);
  c.lineWidth = 1.5;
  c.lineCap = 'round';
  const dx = flip.x ? -1 : 1;
  const dy = flip.y ? -1 : 1;
  c.shadowColor = rgba(accent, 0.15);
  c.shadowBlur = 10;
  c.beginPath();
  c.moveTo(x, y + dy * size);
  c.lineTo(x, y);
  c.lineTo(x + dx * size, y);
  c.stroke();
  c.beginPath();
  c.arc(x + dx * 4, y + dy * 4, 2, 0, Math.PI * 2);
  c.fillStyle = rgba(accent, 0.4);
  c.fill();
  c.restore();
}

function drawBanner() {
  const accent = $('accentColor').value;
  const bg = $('bgColor').value;
  const name = $('botName').value;
  const tag = $('tagline').value;
  const user = $('botUser').value;
  const site = $('website').value;

  bx.setTransform(BDPR, 0, 0, BDPR, 0, 0);
  bx.clearRect(0, 0, BW, BH);

  // Background
  bx.fillStyle = bg;
  bx.fillRect(0, 0, BW, BH);

  const glow1 = bx.createRadialGradient(BW * 0.12, BH * 0.25, 0, BW * 0.12, BH * 0.25, BW * 0.6);
  glow1.addColorStop(0, rgba(accent, 0.10));
  glow1.addColorStop(0.4, rgba(accent, 0.04));
  glow1.addColorStop(1, 'transparent');
  bx.fillStyle = glow1;
  bx.fillRect(0, 0, BW, BH);

  const glow2 = bx.createRadialGradient(BW * 0.88, BH * 0.78, 0, BW * 0.88, BH * 0.78, BW * 0.35);
  glow2.addColorStop(0, rgba(accent, 0.07));
  glow2.addColorStop(1, 'transparent');
  bx.fillStyle = glow2;
  bx.fillRect(0, 0, BW, BH);

  const glow3 = bx.createRadialGradient(BW * 0.45, BH * 0.4, 0, BW * 0.45, BH * 0.4, BW * 0.3);
  glow3.addColorStop(0, rgba(accent, 0.03));
  glow3.addColorStop(1, 'transparent');
  bx.fillStyle = glow3;
  bx.fillRect(0, 0, BW, BH);

  // Dot grid
  bx.fillStyle = rgba('#ffffff', 0.018);
  for (let x = 20; x < BW; x += 30) {
    for (let y = 20; y < BH; y += 30) {
      bx.beginPath();
      bx.arc(x, y, 0.5, 0, Math.PI * 2);
      bx.fill();
    }
  }

  // Noise
  bx.save();
  bx.globalAlpha = 0.025;
  for (let i = 0; i < 4000; i++) {
    bx.fillStyle = Math.random() > 0.5 ? '#ffffff' : '#000000';
    bx.fillRect(Math.random() * BW, Math.random() * BH, 1, 1);
  }
  bx.restore();

  // Equalizer
  drawEqualizerBars(bx, 40, 340, 5, 130, 20, accent);

  // Bot Logo (loaded from image)
  if (logoLoaded) {
    const logoR = 90;
    const logoCX = 700;
    const logoCY = 175;
    bx.save();
    bx.beginPath();
    bx.arc(logoCX, logoCY, logoR, 0, Math.PI * 2);
    bx.clip();

    // Draw the logo image into the circle
    bx.drawImage(logoSrc, logoCX - logoR, logoCY - logoR, logoR * 2, logoR * 2);

    bx.restore();

    // Outer ring around logo
    bx.save();
    bx.shadowColor = rgba(accent, 0.3);
    bx.shadowBlur = 15;
    bx.beginPath();
    bx.arc(logoCX, logoCY, logoR + 2, 0, Math.PI * 2);
    bx.strokeStyle = rgba(accent, 0.3);
    bx.lineWidth = 2;
    bx.stroke();
    bx.restore();

    // Highlight arc on logo circle
    bx.save();
    bx.beginPath();
    bx.arc(logoCX, logoCY, logoR, -2.2, -0.8);
    bx.strokeStyle = rgba('#ffffff', 0.08);
    bx.lineWidth = 2;
    bx.stroke();
    bx.restore();
  }

  // Sound waves
  drawSoundWave(bx, 100, 275, 350, 7, 4.5, 0.12, accent);
  drawSoundWave(bx, 120, 288, 300, 5, 5.5, 0.08, accent);
  drawSoundWave(bx, 110, 300, 280, 4, 6, 0.05, accent);

  // Title
  bx.save();
  bx.font = 'bold 54px "Space Grotesk", Inter, -apple-system, sans-serif';
  bx.textAlign = 'left';
  bx.textBaseline = 'alphabetic';
  bx.shadowColor = rgba(accent, 0.35);
  bx.shadowBlur = 40;
  const titleGrad = bx.createLinearGradient(95, 140, 520, 140);
  titleGrad.addColorStop(0, '#ffffff');
  titleGrad.addColorStop(0.5, '#ffffff');
  titleGrad.addColorStop(1, rgba(accent, 0.85));
  bx.fillStyle = titleGrad;
  bx.fillText(name, 95, 160);
  bx.restore();

  // Underline
  bx.save();
  bx.font = 'bold 54px "Space Grotesk", Inter, -apple-system, sans-serif';
  const titleW = bx.measureText(name).width;
  const ulGrad = bx.createLinearGradient(95, 0, 95 + titleW * 0.45, 0);
  ulGrad.addColorStop(0, accent);
  ulGrad.addColorStop(1, 'transparent');
  bx.fillStyle = ulGrad;
  bx.fillRect(95, 172, titleW * 0.45, 3);
  bx.shadowColor = rgba(accent, 0.6);
  bx.shadowBlur = 8;
  bx.beginPath();
  bx.arc(95 + titleW * 0.45, 173.5, 3, 0, Math.PI * 2);
  bx.fillStyle = accent;
  bx.fill();
  bx.restore();

  // Tagline
  bx.save();
  bx.font = '18px "DM Sans", Inter, -apple-system, sans-serif';
  bx.fillStyle = '#7a7a92';
  bx.textAlign = 'left';
  bx.fillText(tag, 95, 218);
  bx.restore();

  // Feature pills
  let pillX = 95;
  ['Song Downloads', 'Playlists', '320kbps Quality'].forEach(f => {
    const w = drawFeaturePill(bx, pillX, 320, f, accent);
    pillX += w + 12;
  });

  // Divider
  bx.save();
  const divGrad = bx.createLinearGradient(50, 0, BW - 50, 0);
  divGrad.addColorStop(0, 'transparent');
  divGrad.addColorStop(0.15, rgba(accent, 0.08));
  divGrad.addColorStop(0.85, rgba(accent, 0.08));
  divGrad.addColorStop(1, 'transparent');
  bx.fillStyle = divGrad;
  bx.fillRect(50, 392, BW - 100, 1);
  bx.restore();

  // Bot username
  bx.save();
  bx.font = 'bold 17px "Space Grotesk", Inter, -apple-system, sans-serif';
  bx.fillStyle = accent;
  bx.textAlign = 'left';
  bx.shadowColor = rgba(accent, 0.25);
  bx.shadowBlur = 12;
  bx.fillText(user, 95, 440);
  bx.restore();

  // Website with globe
  bx.save();
  bx.font = '600 15px "Space Grotesk", Inter, -apple-system, sans-serif';
  const stw = bx.measureText(site).width;
  drawGlobeIcon(bx, BW - 95 - stw - 24, 436, 8, accent);
  bx.fillStyle = rgba('#ffffff', 0.5);
  bx.textAlign = 'right';
  bx.fillText(site, BW - 95, 440);
  bx.restore();

  // Instructions
  bx.save();
  bx.font = '13px "DM Sans", Inter, -apple-system, sans-serif';
  bx.fillStyle = '#4a4a60';
  bx.textAlign = 'center';
  bx.textBaseline = 'middle';
  bx.fillText('Send a Spotify or YouTube link  \u00B7  or search with /song name', BW / 2, 472);
  bx.restore();

  // Corner accents
  drawCornerAccent(bx, 26, 26, 30, {x:false,y:false}, accent);
  drawCornerAccent(bx, BW-26, 26, 30, {x:true,y:false}, accent);
  drawCornerAccent(bx, 26, BH-26, 30, {x:false,y:true}, accent);
  drawCornerAccent(bx, BW-26, BH-26, 30, {x:true,y:true}, accent);

  // Floating notes
  bx.save();
  [[170,55,20],[640,65,16],[50,240,14],[560,45,11],[760,340,18],[300,75,10],[420,55,8]].forEach(([nx,ny,ns],i) => {
    bx.font = `${ns}px serif`;
    bx.fillStyle = rgba(accent, 0.06 + (i%3)*0.015);
    bx.textAlign = 'center';
    bx.textBaseline = 'middle';
    bx.fillText(['\u266A','\u266B','\u2669','\u266C'][i%4], nx, ny);
  });
  bx.restore();

  // Top edge
  bx.save();
  const topGrad = bx.createLinearGradient(0, 0, BW, 0);
  topGrad.addColorStop(0, 'transparent');
  topGrad.addColorStop(0.3, rgba(accent, 0.15));
  topGrad.addColorStop(0.7, rgba(accent, 0.15));
  topGrad.addColorStop(1, 'transparent');
  bx.fillStyle = topGrad;
  bx.fillRect(0, 0, BW, 1);
  bx.restore();
}

/* ===================== MAIN DRAW ===================== */

function drawAll() {
  drawBanner();
  drawLogo();
}

/* ===================== DOWNLOADS ===================== */

function dlBanner(fmt) {
  const a = document.createElement('a');
  a.download = `welcome@2x.${fmt}`;
  a.href = bc.toDataURL(fmt === 'png' ? 'image/png' : 'image/jpeg', 0.96);
  a.click();
}

function dlLogo(size, fmt) {
  if (!logoLoaded) { alert('Logo still loading...'); return; }
  const tmp = document.createElement('canvas');
  tmp.width = size; tmp.height = size;
  tmp.getContext('2d').drawImage(logoSrc, 0, 0, size, size);
  const a = document.createElement('a');
  a.download = `bot-logo-${size}.${fmt || 'png'}`;
  a.href = tmp.toDataURL(fmt === 'jpg' ? 'image/jpeg' : 'image/png', fmt === 'jpg' ? 0.96 : undefined);
  a.click();
}

/* ===================== EVENTS ===================== */

fields.forEach(f => f.addEventListener('input', drawAll));
$('dlBannerJpg').addEventListener('click', () => dlBanner('jpg'));
$('dlBannerPng').addEventListener('click', () => dlBanner('png'));
$('dlLogoOrig').addEventListener('click', () => dlLogo(1024, 'png'));
$('dlLogo512').addEventListener('click', () => dlLogo(512, 'png'));
$('dlLogoJpg').addEventListener('click', () => dlLogo(1024, 'jpg'));

drawAll();
</script>
