<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0f"/>
      <stop offset="50%" stop-color="#111118"/>
      <stop offset="100%" stop-color="#0a0a0f"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e8793a"/>
      <stop offset="100%" stop-color="#f09d5e"/>
    </linearGradient>
    <linearGradient id="glow" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#e8793a" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#e8793a" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Glow -->
  <ellipse cx="600" cy="200" rx="400" ry="250" fill="url(#glow)"/>

  <!-- Music note icon -->
  <g transform="translate(530, 80)">
    <path d="M9 18V5l12-2v13" stroke="#e8793a" stroke-width="2" fill="none" transform="scale(2.5)"/>
    <circle cx="15" cy="45" r="7.5" stroke="#e8793a" stroke-width="2" fill="none"/>
    <circle cx="45" cy="40" r="7.5" stroke="#e8793a" stroke-width="2" fill="none"/>
  </g>

  <!-- Main title -->
  <text x="600" y="260" text-anchor="middle" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="64" font-weight="800" fill="white" letter-spacing="-2">TuneDrop</text>

  <!-- Subtitle -->
  <text x="600" y="320" text-anchor="middle" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="28" font-weight="500" fill="#9d9daa">Spotify &amp; YouTube to MP3 — Free, Instant, 320kbps</text>

  <!-- Feature pills -->
  <g transform="translate(280, 380)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="140" height="40" rx="20" fill="#e8793a" fill-opacity="0.15" stroke="#e8793a" stroke-opacity="0.3" stroke-width="1"/>
    <text x="70" y="26" text-anchor="middle" font-family="'Inter', system-ui, sans-serif" font-size="14" font-weight="600" fill="#f09d5e">320kbps MP3</text>

    <!-- Pill 2 -->
    <rect x="160" y="0" width="120" height="40" rx="20" fill="#e8793a" fill-opacity="0.15" stroke="#e8793a" stroke-opacity="0.3" stroke-width="1"/>
    <text x="220" y="26" text-anchor="middle" font-family="'Inter', system-ui, sans-serif" font-size="14" font-weight="600" fill="#f09d5e">No Login</text>

    <!-- Pill 3 -->
    <rect x="300" y="0" width="140" height="40" rx="20" fill="#e8793a" fill-opacity="0.15" stroke="#e8793a" stroke-opacity="0.3" stroke-width="1"/>
    <text x="370" y="26" text-anchor="middle" font-family="'Inter', system-ui, sans-serif" font-size="14" font-weight="600" fill="#f09d5e">Playlist ZIP</text>

    <!-- Pill 4 -->
    <rect x="460" y="0" width="120" height="40" rx="20" fill="#e8793a" fill-opacity="0.15" stroke="#e8793a" stroke-opacity="0.3" stroke-width="1"/>
    <text x="520" y="26" text-anchor="middle" font-family="'Inter', system-ui, sans-serif" font-size="14" font-weight="600" fill="#f09d5e">Free</text>
  </g>

  <!-- CTA -->
  <rect x="460" y="470" width="280" height="56" rx="28" fill="url(#accent)"/>
  <text x="600" y="505" text-anchor="middle" font-family="'Inter', system-ui, sans-serif" font-size="18" font-weight="700" fill="white">Open on Telegram →</text>

  <!-- URL -->
  <text x="600" y="580" text-anchor="middle" font-family="'Inter', system-ui, sans-serif" font-size="16" font-weight="500" fill="#9d9daa">tdrp.cc</text>
</svg>
